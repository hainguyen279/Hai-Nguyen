<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tính điểm CUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060a;
    --glass: rgba(12,15,22,0.55);
    --glass-edge: rgba(143,216,255,0.28);
    --ice:#8fd8ff;
    --white:#f5f7fb;
    --muted:#9aa3b5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--void);
    color:var(--white);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    max-width:420px; width:90%;
    padding:32px 28px;
    background:var(--glass);
    border:1px solid var(--glass-edge);
    border-radius:20px;
    text-align:center;
    backdrop-filter:blur(18px);
  }
  h1{
    font-family:'Rajdhani',sans-serif;
    font-size:24px; letter-spacing:0.08em; text-transform:uppercase;
    margin:0 0 10px;
  }
  p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 20px; }
  a.back{
    display:inline-block; color:var(--ice); text-decoration:none;
    font-family:'Rajdhani',sans-serif; letter-spacing:0.06em; font-size:13px;
    border:1px solid var(--glass-edge); padding:10px 18px; border-radius:10px;
  }
  a.back:hover{ background:rgba(143,216,255,0.08); }
</style>
</head>
<body>
  <div class="card">
    <h1>Tính điểm CUS</h1>
    <p>Trang này đang chờ nội dung tính năng thật — hãy cho biết công thức / cách tính điểm CUS cần dùng để hoàn thiện trang này.</p>
    <a class="back" href="aura-phonk-player.html">← Quay lại trang nhạc</a>
  </div>
</body>
</html>
